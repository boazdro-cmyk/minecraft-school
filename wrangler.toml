name = "minecraft-school"
main = "worker.js"
compatibility_date = "2026-10-16"

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/health", "/ws"]

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
